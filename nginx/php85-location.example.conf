# EJEMPLO para Ubuntu 22.04 + Nginx.
# NO copies este bloque si tu sitio ya tiene un location ~ \.php$.
# En ese caso, edita el bloque existente y cambia únicamente fastcgi_pass.
#
# Dentro del bloque server { ... } del sitio:
location ~ \.php$ {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php85.12-fpm/php-fpm.sock;
}
